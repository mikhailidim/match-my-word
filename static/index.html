<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match My Word</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link href="https://fonts.googleapis.com/css?family=Rowdies" rel="stylesheet">
        <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z8Z3GEMHV2"></script>
    <script>^
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Z8Z3GEMHV2');
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="/static/index.js" type="text/javascript"></script>
</head>

<body>
    <div id="header">
        <div class="header-side header-left">
            <div id="en-ru" class="control">en</div>
            <div id="reset" class="control" role="button" tabindex="0" aria-label="Reset input and keyboard colors" title="Reset input and keyboard colors">&#8635;</div>
        </div>
        <div class="length-controls">
            <div id="less" class="control">-</div>
            <div id="title">MATCH MY WORD</div>
            <div id="more" class="control">+</div>
        </div>
        <div class="header-side header-right">
            <div id="hbtn" class="control">?</div>
        </div>
    </div>
    <div id="help" class="popdown"></div>
    <div id="inputs" class="inputs">
        <div class="letter"></div>
        <div class="letter"></div>
        <div class="letter"></div>
        <div class="letter"></div>
        <div class="letter"></div>
    </div>
    <div id="results"></div>
</body>
<script>
    $("#en-ru").click(toggle_api);
    $("#reset").on("click", reset_game).on("keydown", function(event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            reset_game();
        }
    });
    $("#hbtn,#help").click(function(){
        $("#help").load("/static/"+$("#en-ru").text()+"_help.html");
        $("#help").toggleClass(["popup","popdown"]);
    });
    $(document).keydown(clear_letter);
    $("body").keypress(text_input);
    $("body").on("redraw", update_results);
    $("#more").click(add_char);
    $("#less").click(rem_char);
    // Load default keyboard
    toggle_api();
</script>

</html>
